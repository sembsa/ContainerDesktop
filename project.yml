name: ContainerGUI
options:
  bundleIdPrefix: com.containerdesktop
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # English is the development/base language so that systems whose language is
  # neither Polish nor Chinese fall back to English (fixes issue #1) instead of Polish.
  developmentLanguage: en

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.0.0
  Yams:
    url: https://github.com/jpsim/Yams
    from: 5.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  # Ghostty's terminal engine, as a prebuilt XCFramework. Pinned exactly, not
  # `from:` — libghostty's embedding API is explicitly not stabilized yet ("used
  # primarily by the macOS app", may change between releases), so picking up a new
  # version has to be a deliberate, re-tested decision. Ghostty itself publishes
  # only ghostty-vt (the VT parser); this package builds the full library.
  libghostty:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.3.2

schemes:
  ContainerGUI:
    build:
      targets:
        ContainerGUI: all
        ContainerGUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ContainerGUITests

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ContainerGUI:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ContainerGUI
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Yams
        product: Yams
      - package: Sparkle
        product: Sparkle
      - package: libghostty
        product: GhosttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.containerdesktop.ContainerGUI
        PRODUCT_NAME: ContainerGUI
        CODE_SIGN_ENTITLEMENTS: ContainerGUI/ContainerGUI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ContainerGUI/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pl, zh-Hans]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Container Desktop
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        # Sparkle auto-update (appcast hosted on GitHub Pages).
        SUFeedURL: https://sembsa.github.io/ContainerDesktop/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: D/C+a86F4ZfbqGMnz4YoO/EjNZKxYRSJ8eUgcjvHKbY=

  # Self-contained logic test bundle: compiles the model + CLI sources directly
  # and bundles the captured fixtures, so it runs headless without a GUI host.
  ContainerGUITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ContainerGUITests
      - path: ContainerGUI/Models
      - path: ContainerGUI/Common/JSONValue.swift
      - path: ContainerGUI/CLI/RunCommandBuilder.swift
      - path: ContainerGUI/CLI/CLIError.swift
      - path: ContainerGUI/CLI/ContainerCLI.swift
      - path: ContainerGUI/CLI/ProcessRunner.swift
      - path: ContainerGUI/CLI/ProcessLineReader.swift
      - path: ContainerGUI/CLI/BinaryResolver.swift
      - path: ContainerGUI/Features/Containers/LogTailLimit.swift
      - path: ContainerGUI/Features/Helm/ChartValues.swift
      - path: ContainerGUI/Terminal/TerminalEngine.swift
      - path: ContainerGUI/Compose
      - path: Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - package: Yams
        product: Yams
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.containerdesktop.ContainerGUITests
